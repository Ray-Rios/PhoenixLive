apiVersion: v1
kind: ConfigMap
metadata:
  name: phoenix-config
data:
  MIX_ENV: "prod"
  DB_USERNAME: "postgres"
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_NAME: "phoenixapp_prod"
  DATABASE_URL: "postgresql://postgres@db:5432/phoenixapp_prod"
  REDIS_URL: "redis://redis:6379/0"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  CORS_ALLOWED_ORIGINS: "https://rio-tek.com,https://www.rio-tek.com"
  RUST_LOG: "info"
  PHOENIX_SERVICE_URL: "https://rio-tek.com"
  PHOENIX_HOST: "rio-tek.com"
  ENABLE_REDIS: "true"