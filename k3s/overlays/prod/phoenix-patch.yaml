apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-web
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: phoenix
        env:
        - name: MIX_ENV
          value: "prod"
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: phoenix-secrets
              key: SENDGRID_API_KEY
        - name: HCAPTCHA_SITE_KEY
          valueFrom:
            secretKeyRef:
              name: phoenix-secrets
              key: HCAPTCHA_SITE_KEY
        - name: HCAPTCHA_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: phoenix-secrets
              key: HCAPTCHA_SECRET_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"