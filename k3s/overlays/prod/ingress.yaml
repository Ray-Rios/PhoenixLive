apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phoenix-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  tls:
  - hosts:
    - rio-tek.com
    - www.rio-tek.com
    secretName: rio-tek-tls
  rules:
  - host: rio-tek.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: phoenix-web
            port:
              number: 443
  - host: www.rio-tek.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: phoenix-web
            port:
              number: 443
---
# Mailhog ingress for development access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailhog-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - mail.rio-tek.com
    secretName: mailhog-tls
  rules:
  - host: mail.rio-tek.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mailhog
            port:
              number: 8025