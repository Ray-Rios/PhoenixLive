apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phoenix-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - phxlive.net
    - www.phxlive.net
    secretName: phxlive-tls
  rules:
  - host: phxlive.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: phoenix-web
            port:
              number: 80
  - host: www.phxlive.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: phoenix-web
            port:
              number: 80
---
# Mailhog ingress for development access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailhog-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: mailhog-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - Mailhog Admin'
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - mail.phxlive.net
    secretName: mailhog-tls
  rules:
  - host: mail.phxlive.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mailhog
            port:
              number: 8025