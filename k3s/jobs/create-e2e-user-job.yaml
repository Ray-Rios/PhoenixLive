apiVersion: batch/v1
kind: Job
metadata:
  name: create-e2e-user
  namespace: phoenixapp
  labels:
    app: ci
    job: create-e2e-user
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-e2e-user
          image: curlimages/curl:8.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TEST_URL
              value: "http://phoenix-web"
            # Host header to use for the registration request when the app enforces a canonical host
            - name: TEST_HOST
              value: "phxlive.net"
            # credentials expected to be provided via ci-playwright-auth secret
            - name: TEST_USER
              valueFrom:
                secretKeyRef:
                  name: ci-playwright-auth
                  key: user
            - name: TEST_PWD
              valueFrom:
                secretKeyRef:
                  name: ci-playwright-auth
                  key: pwd
            - name: TEST_NAME
              value: "e2e_test"
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              if [ -z "${TEST_USER:-}" ] || [ -z "${TEST_PWD:-}" ]; then
                echo "No TEST_USER/TEST_PWD provided via secret ci-playwright-auth — nothing to do"
                exit 0
              fi

              URL=${TEST_URL%/}
              EMAIL=${TEST_USER}
              NAME=${TEST_NAME}
              PWD=${TEST_PWD}

              echo "Registering e2e user: ${EMAIL} against ${URL}"

              # Try register (idempotent-ish) — likely returns 201 on success or 409 when user exists
              set +e
              HTTP_CODE=$(curl -s -o /tmp/register_resp -w "%{http_code}" -X POST "${URL}/api/auth/register" \
                -H "Content-Type: application/json" \
                -H "Host: ${TEST_HOST}" \
                -d "{\"email\":\"${EMAIL}\",\"name\":\"${NAME}\",\"password\":\"${PWD}\"}")
              RC=$?
              set -e

              echo "Register response HTTP code: ${HTTP_CODE} (curl rc ${RC})"
              case "${HTTP_CODE}" in
                200|201)
                  echo "User registered or returned success:\n"; cat /tmp/register_resp || true
                  ;;
                409)
                  echo "User already exists — continuing"
                  ;;
                *)
                  echo "Unexpected register HTTP code ${HTTP_CODE}; continuing to attempt dev-verify"
                  ;;
              esac

              # Try dev-verify (development convenience) - ignore errors if endpoint not present
              set +e
              VCODE=$(curl -s -o /tmp/verify_resp -w "%{http_code}" -X POST "${URL}/api/auth/dev-verify" \
                -H "Content-Type: application/json" -d "{\"email\":\"${EMAIL}\"}")
              # include Host for dev-verify too (idempotent - may 404 if not allowed)
              VCODE=$(curl -s -o /tmp/verify_resp -w "%{http_code}" -X POST "${URL}/api/auth/dev-verify" \
                -H "Content-Type: application/json" -H "Host: ${TEST_HOST}" -d "{\"email\":\"${EMAIL}\"}")
              set -e
              echo "Dev-verify response HTTP code: ${VCODE}"

              echo "create-e2e-user job finished"
      volumes: []
  ttlSecondsAfterFinished: 3600
