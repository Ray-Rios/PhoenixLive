apiVersion: batch/v1
kind: Job
metadata:
  name: phoenix-mix-tests-from-git
  namespace: phoenixapp
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: mix-tests
        # Use a full Elixir image (Debian) so we can apt-get git and run mix
        image: elixir:1.19-alpine
        imagePullPolicy: IfNotPresent
        env:
          - name: MIX_ENV
            value: test
          - name: DATABASE_URL
            value: "postgresql://postgres:postgres@db:5432/phoenixapp_test"
          - name: REDIS_URL
            value: "redis://redis:6379/0"
          - name: DB_HOST
            value: "db"
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: "phoenixapp_test"
          - name: GIT_REPO
            value: "https://github.com/ray-rios/phoenixlive.git"
          - name: GIT_REF
            value: "master"
          - name: SECRET_KEY_BASE
            # Must be at least 64 bytes for cookie signing; tests rely on Phoenix session
            value: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          - name: LIVE_VIEW_SIGNING_SALT
            value: "test_live_view_salt"
          - name: GUARDIAN_SECRET_KEY
            value: "test_guardian_secret"
        command: ["/bin/sh", "-lc"]
        args:
          - |
            set -e
            # install required build tools - works on both Debian (apt) and Alpine (apk)
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache git build-base curl openssl libstdc++ gcc g++ musl-dev
            else
              apt-get update -y
              apt-get install -y git build-essential curl
            fi
            git clone --depth 1 --branch ${GIT_REF} ${GIT_REPO} /work || (cd /work && git fetch origin ${GIT_REF} && git checkout ${GIT_REF})
            cd /work
            mix local.hex --force
            mix local.rebar --force
            mix deps.get
            export MIX_ENV=test
            echo "Running DB setup/migrations for test DB"
            mix ecto.create || true
            mix ecto.migrate || true
            echo "Running tests..."
            mix test --color || (echo "Tests failed"; exit 1)
  backoffLimit: 0
