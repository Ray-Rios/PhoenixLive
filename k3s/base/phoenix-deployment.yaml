apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-web
  labels:
    app: phoenix-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix-web
  template:
    metadata:
      labels:
        app: phoenix-web
    spec:
      serviceAccountName: phoenix-sa
      # Init container to fix volume permissions
      initContainers:
      - name: fix-permissions
        image: alpine:3.22
        command: ['sh', '-c', 'chown -R 101:102 /app/uploads && chmod -R 755 /app/uploads']
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
      containers:
      - name: phoenix
        image: phoenixapp:latest
        ports:
        - containerPort: 4000
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RELEASE_DISTRIBUTION
          value: "name"
        - name: RELEASE_NODE
          value: "phoenix_app@$(POD_IP)"
        envFrom:
        - configMapRef:
            name: phoenix-config
        - secretRef:
            name: phoenix-secrets
        command: ["/usr/local/bin/phx-start.sh"]
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - curl -f http://127.0.0.1:4000/health || exit 1
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - curl -f http://127.0.0.1:4000/health || exit 1
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        # Models volume temporarily disabled - uncomment when PV issue is resolved
        # - name: models
        #   mountPath: /app/priv/static/models
        # Temporarily removed security context to fix permission issues
        # securityContext:
        #   allowPrivilegeEscalation: false
        #   capabilities:
        #     drop:
        #     - ALL
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: phoenix-uploads-pvc
      # Models volume temporarily disabled - uncomment when PV issue is resolved
      # - name: models
      #   persistentVolumeClaim:
      #     claimName: phoenix-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-web
  labels:
    app: phoenix-web
spec:
  type: ClusterIP
  selector:
    app: phoenix-web
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 4000