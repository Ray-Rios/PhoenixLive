apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-web
  labels:
    app: phoenix-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix-web
  template:
    metadata:
      labels:
        app: phoenix-web
    spec:
      containers:
      - name: phoenix
        image: phoenixapp:latest
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: phoenix-config
        - secretRef:
            name: phoenix-secrets
        command: ["/usr/local/bin/start.sh"]
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-web
spec:
  type: NodePort
  selector:
    app: phoenix-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 4000
    nodePort: 30080