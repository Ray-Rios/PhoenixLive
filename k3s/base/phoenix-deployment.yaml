apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-web
  labels:
    app: phoenix-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix-web
  template:
    metadata:
      labels:
        app: phoenix-web
    spec:
      containers:
      - name: phoenix
        image: phoenixapp:latest
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: phoenix-config
        - secretRef:
            name: phoenix-secrets
        command: ["/usr/local/bin/phx-start.sh"]
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # Temporarily removed security context to fix permission issues
        # securityContext:
        #   allowPrivilegeEscalation: false
        #   capabilities:
        #     drop:
        #     - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-web
spec:
  type: ClusterIP
  selector:
    app: phoenix-web
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 4000