apiVersion: v1
kind: ServiceAccount
metadata:
  name: phoenix-sa
  namespace: phoenixapp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phoenix-role
  namespace: phoenixapp
rules:
- apiGroups: [""]
  resources: ["endpoints", "pods", "nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phoenix-role-binding
  namespace: phoenixapp
subjects:
- kind: ServiceAccount
  name: phoenix-sa
  namespace: phoenixapp
roleRef:
  kind: Role
  name: phoenix-role
  apiGroup: rbac.authorization.k8s.io
