apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phoenix-uploads-pvc
  namespace: phoenixapp
  labels:
    app: phoenix-web
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Use manual storage class to bind to our local Windows directory
  storageClassName: manual
  # Bind to the specific PV we created
  volumeName: phoenix-uploads-local-pv
