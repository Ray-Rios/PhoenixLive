apiVersion: v1
kind: PersistentVolume
metadata:
  name: phoenix-uploads-local-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    # Use Docker VM internal storage (survives docker system prune)
    # To sync to Windows, run: ./sync-uploads-from-k8s.sh
    path: /var/lib/k8s-pvs/phoenix-uploads
    type: DirectoryOrCreate
