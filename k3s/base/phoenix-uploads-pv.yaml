apiVersion: v1
kind: PersistentVolume
metadata:
  name: phoenix-uploads-local-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    # Use /var/lib/k8s-pvs which Docker Desktop handles properly
    # We'll copy uploads there from the Windows directory
    path: /var/lib/k8s-pvs/phoenix-uploads
    type: DirectoryOrCreate
