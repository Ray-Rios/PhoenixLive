# The world server's copy of the games server API key.
#
# COPY THIS TO raysspacesim-secrets.yaml AND FILL IT IN. Do not commit the
# filled-in copy - GAMES_SERVER_API_KEY authorises acting as ANY user, so it is
# a master credential and belongs in the same place the other real secrets do.
#
# WHY A SECOND COPY OF A SECRET THAT ALREADY EXISTS
#
# A Secret is namespaced and cannot be read across namespaces. The world server
# runs in `raysspacesim` while phoenix-secrets lives in `phoenixapp`, so the
# pod needs its own. There is no way around this short of a controller that
# mirrors secrets between namespaces, which is a great deal more machinery than
# one file.
#
# The failure when it is missing is at least loud and specific: the pod sits in
# CreateContainerConfigError and `kubectl describe pod` names the Secret it
# could not find. What it is NOT is subtle - the server does not start and
# quietly refuse joins.
#
# Create it by hand instead, if you prefer not to keep a file at all:
#
#   kubectl -n raysspacesim create secret generic raysspacesim-secrets \
#     --from-literal=GAMES_SERVER_API_KEY="<the same value the web pods use>"
#
# It MUST be the same value as the hub's GAMES_SERVER_API_KEY. A server holding
# a different key is refused on every join, which from a player's seat looks
# exactly like a broken join gate rather than a misconfigured one.
apiVersion: v1
kind: Secret
metadata:
  name: raysspacesim-secrets
  namespace: raysspacesim
type: Opaque
stringData:
  GAMES_SERVER_API_KEY: "REPLACE_ME"
